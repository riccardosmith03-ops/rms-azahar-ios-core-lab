name: Azahar iPhoneOS runtime layout (UNTESTED)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azahar-runtime-layout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-core:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout the reviewed carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: carrier
          persist-credentials: false
      - name: Checkout the fixed official core with pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: azahar-emu/azahar
          ref: f570b53f9c9bcf42b0741afdd8cf0a6dfa5f98f5
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Report Apple toolchain and prepare host tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install cmake ninja
          cmake --version
          python3 -B carrier/tests/test-package-core.py
      - name: Apply the guarded patch and compile with two jobs
        shell: bash
        run: bash carrier/scripts/build-core.sh upstream "$RUNNER_TEMP/azahar-ios-build"
      - name: Inspect and package the unsigned native framework
        shell: bash
        run: |
          set -euo pipefail
          python3 -B carrier/scripts/package-core.py \
            --binary "$RUNNER_TEMP/azahar-ios-build/bin/Release/azahar_libretro.dylib" \
            --out dist
      - name: Upload only the inspected framework package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Azahar-iOS-UNSIGNED-runtime-layout-f570b53
          path: |
            dist/rms-azahar-runtime-layout-UNSIGNED.zip
            dist/inspection.json
          if-no-files-found: error
          retention-days: 3
